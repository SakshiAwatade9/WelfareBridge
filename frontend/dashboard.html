<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — WelfareBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="wb-navbar"></div>

<main class="container py-4">
  <div id="loading-state" class="text-center py-5 text-muted">Loading your dashboard…</div>

  <div id="dashboard-content" class="d-none">
    <div class="mb-4">
      <h1 class="fw-bold" style="font-size:24px;">Hello, <span id="greet-name"></span></h1>
      <div class="text-muted" style="font-size:14px;">Based on your profile, here are your ranked scheme matches. Click a card for details.</div>
    </div>

    <div class="row g-2 mb-4">
      <div class="col-6 col-md-3">
        <div class="wb-summary-pill"><span class="wb-dot-eligible fs-5">✓</span><div><div class="num" id="stat-eligible">0</div><div class="lbl">Eligible</div></div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="wb-summary-pill"><span class="wb-dot-maybe fs-5">✦</span><div><div class="num" id="stat-maybe">0</div><div class="lbl">Maybe eligible</div></div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="wb-summary-pill"><span class="wb-dot-not fs-5">⚏</span><div><div class="num" id="stat-total">0</div><div class="lbl">Schemes evaluated</div></div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="wb-summary-pill" style="cursor:pointer" onclick="window.location.href='questionnaire.html'">
          <span style="color:var(--blue-600)" class="fs-5">✎</span><div><div class="num" style="font-size:13px;">Edit</div><div class="lbl">Update profile</div></div>
        </div>
      </div>
    </div>

    <div class="row g-2 mb-4">
      <div class="col-12 col-md-5">
        <input class="form-control" id="search-input" placeholder="Search schemes by name, benefit, or category">
      </div>
      <div class="col-6 col-md-3">
        <select class="form-select" id="category-filter"></select>
      </div>
      <div class="col-6 col-md-3">
        <select class="form-select" id="status-filter">
          <option value="All">All statuses</option>
          <option value="Eligible">Eligible</option>
          <option value="Maybe Eligible">Maybe Eligible</option>
          <option value="Not Eligible">Not Eligible</option>
        </select>
      </div>
    </div>

    <div id="scheme-grid" class="row g-3"></div>
    <div id="empty-state" class="wb-empty-state d-none">No schemes match your current filters. Try clearing search or filters.</div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/navbar.js"></script>
<script src="js/scheme-ui.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const user = requireRole("USER");
  let allResults = [];

  if (user) {
    renderNavbar("dashboard");
    document.getElementById("greet-name").textContent = user.name.split(" ")[0];
    loadDashboard();

    document.getElementById("search-input").addEventListener("input", applyFilters);
    document.getElementById("category-filter").addEventListener("change", applyFilters);
    document.getElementById("status-filter").addEventListener("change", applyFilters);
  }

  async function loadDashboard() {
    try {
      allResults = await Api.checkEligibility();
    } catch (err) {
      if (err.message.includes("questionnaire")) {
        window.location.href = "questionnaire.html";
        return;
      }
      showToast(err.message);
      document.getElementById("loading-state").textContent = "Could not load your dashboard. Is the backend running?";
      return;
    }

    document.getElementById("loading-state").classList.add("d-none");
    document.getElementById("dashboard-content").classList.remove("d-none");

    const categories = ["All", ...new Set(allResults.map(r => r.category))];
    document.getElementById("category-filter").innerHTML = categories.map(c => `<option value="${c}">${c === "All" ? "All categories" : c}</option>`).join("");

    updateSummary();
    applyFilters();
  }

  function updateSummary() {
    document.getElementById("stat-eligible").textContent = allResults.filter(r => r.status === "Eligible").length;
    document.getElementById("stat-maybe").textContent = allResults.filter(r => r.status === "Maybe Eligible").length;
    document.getElementById("stat-total").textContent = allResults.length;
  }

  function applyFilters() {
    const search = document.getElementById("search-input").value.toLowerCase();
    const category = document.getElementById("category-filter").value;
    const status = document.getElementById("status-filter").value;

    const filtered = allResults.filter(r => {
      if (category && category !== "All" && r.category !== category) return false;
      if (status && status !== "All" && r.status !== status) return false;
      if (search && !r.name.toLowerCase().includes(search) && !r.benefit.toLowerCase().includes(search) && !r.category.toLowerCase().includes(search)) return false;
      return true;
    });

    const grid = document.getElementById("scheme-grid");
    const empty = document.getElementById("empty-state");

    if (filtered.length === 0) {
      grid.innerHTML = "";
      empty.classList.remove("d-none");
    } else {
      empty.classList.add("d-none");
      grid.innerHTML = filtered.map(r => renderSchemeCard(r, "openDashboardScheme", "toggleSaveDashboard")).join("");
    }
  }

  function openDashboardScheme(id) {
    const result = allResults.find(r => r.id === id);
    if (result) openSchemeModal(result, toggleSaveDashboard);
  }

  async function toggleSaveDashboard(id) {
    const result = allResults.find(r => r.id === id);
    if (!result) return;
    try {
      if (result.saved) {
        await Api.unsaveScheme(id);
        result.saved = false;
        showToast("Removed from saved schemes.");
      } else {
        await Api.saveScheme(id);
        result.saved = true;
        showToast("Saved to your list.");
      }
      applyFilters();
      const saveBtn = document.getElementById("modal-save-btn");
      if (saveBtn) saveBtn.textContent = result.saved ? "Remove from saved" : "Save scheme";
    } catch (err) {
      showToast(err.message);
    }
  }
</script>
</body>
</html>
