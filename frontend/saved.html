<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saved Schemes — WelfareBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="wb-navbar"></div>

<main class="container py-4">
  <div class="mb-4">
    <h1 class="fw-bold" style="font-size:24px;">Saved schemes</h1>
    <div class="text-muted" style="font-size:14px;" id="saved-sub">Schemes you've bookmarked for later.</div>
  </div>

  <div id="loading-state" class="text-center py-5 text-muted">Loading your saved schemes…</div>
  <div id="scheme-grid" class="row g-3"></div>
  <div id="empty-state" class="wb-empty-state d-none">You haven't saved any schemes yet. Browse your dashboard and tap the bookmark icon on a scheme card.</div>
</main>

<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/navbar.js"></script>
<script src="js/scheme-ui.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const user = requireRole("USER");
  let savedResults = [];

  if (user) {
    renderNavbar("saved");
    loadSaved();
  }

  async function loadSaved() {
    try {
      savedResults = await Api.listSaved();
    } catch (err) {
      showToast(err.message);
      document.getElementById("loading-state").textContent = "Could not load saved schemes. Is the backend running?";
      return;
    }
    document.getElementById("loading-state").classList.add("d-none");
    renderSaved();
  }

  function renderSaved() {
    document.getElementById("saved-sub").textContent = `Schemes you've bookmarked for later. ${savedResults.length} saved.`;
    const grid = document.getElementById("scheme-grid");
    const empty = document.getElementById("empty-state");

    if (savedResults.length === 0) {
      grid.innerHTML = "";
      empty.classList.remove("d-none");
    } else {
      empty.classList.add("d-none");
      grid.innerHTML = savedResults.map(r => renderSchemeCard(r, "openSavedScheme", "toggleSaveOnSavedPage")).join("");
    }
  }

  function openSavedScheme(id) {
    const result = savedResults.find(r => r.id === id);
    if (result) openSchemeModal(result, toggleSaveOnSavedPage);
  }

  async function toggleSaveOnSavedPage(id) {
    try {
      await Api.unsaveScheme(id);
      savedResults = savedResults.filter(r => r.id !== id);
      showToast("Removed from saved schemes.");
      renderSaved();
      const modalEl = document.getElementById("scheme-modal");
      if (modalEl) bootstrap.Modal.getInstance(modalEl)?.hide();
    } catch (err) {
      showToast(err.message);
    }
  }
</script>
</body>
</html>
