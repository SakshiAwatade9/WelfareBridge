<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard — WelfareBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="wb-navbar"></div>

<main class="container py-4">
  <div class="mb-4">
    <h1 class="fw-bold" style="font-size:24px;">Administrator dashboard</h1>
    <div class="text-muted" style="font-size:14px;">Manage the scheme catalogue and monitor platform usage.</div>
  </div>

  <div class="row g-2 mb-4" id="admin-stats"></div>

  <div class="d-flex mb-3" style="border-bottom:1px solid var(--gray-200);">
    <button class="wb-admin-tab active" id="tab-schemes" onclick="switchAdminTab('schemes')">Schemes</button>
    <button class="wb-admin-tab" id="tab-add" onclick="startAdd()">Add scheme</button>
    <button class="wb-admin-tab" id="tab-stats" onclick="switchAdminTab('stats')">Usage statistics</button>
  </div>

  <div id="panel-schemes">
    <div class="wb-card" style="overflow:hidden;">
      <table class="table mb-0">
        <thead>
          <tr style="background:var(--gray-50);">
            <th class="small text-uppercase text-muted">Scheme</th>
            <th class="small text-uppercase text-muted">Category</th>
            <th class="small text-uppercase text-muted">State</th>
            <th class="small text-uppercase text-muted">Income limit</th>
            <th class="small text-uppercase text-muted">Deadline</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="schemes-table-body"></tbody>
      </table>
    </div>
  </div>

  <div id="panel-add" class="d-none">
    <div class="wb-card p-4">
      <div class="fw-bold mb-3" id="form-heading" style="font-size:15px;">Add a new scheme</div>
      <form id="scheme-form">
        <div class="row g-3 mb-3">
          <div class="col-md-6"><label class="form-label fw-semibold small">Scheme name</label><input class="form-control" id="f-name"></div>
          <div class="col-md-6"><label class="form-label fw-semibold small">Department</label><input class="form-control" id="f-department"></div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Category</label>
            <select class="form-select" id="f-category">
              <option>Education</option><option>Agriculture</option><option>Employment</option>
              <option>Housing</option><option>Healthcare</option><option>Social Security</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Applicable state</label>
            <select class="form-select" id="f-state">
              <option value="All India">All India</option>
              <option>Maharashtra</option><option>Delhi</option><option>Karnataka</option><option>Tamil Nadu</option>
              <option>Uttar Pradesh</option><option>Gujarat</option><option>West Bengal</option><option>Rajasthan</option>
              <option>Punjab</option><option>Kerala</option>
            </select>
          </div>
        </div>
        <div class="mb-3"><label class="form-label fw-semibold small">Benefit summary</label><input class="form-control" id="f-benefit" placeholder="e.g. Annual scholarship of ₹25,000"></div>
        <div class="mb-3"><label class="form-label fw-semibold small">Description</label><textarea class="form-control" id="f-description" rows="2"></textarea></div>
        <div class="row g-3 mb-3">
          <div class="col-md-6"><label class="form-label fw-semibold small">Minimum age (optional)</label><input class="form-control" type="number" id="f-min-age"></div>
          <div class="col-md-6"><label class="form-label fw-semibold small">Maximum age (optional)</label><input class="form-control" type="number" id="f-max-age"></div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6"><label class="form-label fw-semibold small">Maximum annual income (optional, ₹)</label><input class="form-control" type="number" id="f-max-income"></div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Required occupation</label>
            <select class="form-select" id="f-occupation">
              <option value="any">Any occupation</option><option value="student">Student</option><option value="farmer">Farmer</option>
              <option value="employed">Employed</option><option value="self-employed">Self-employed</option><option value="unemployed">Unemployed</option>
            </select>
          </div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Required gender</label>
            <select class="form-select" id="f-gender">
              <option value="any">Any</option><option value="male">Male</option><option value="female">Female</option>
            </select>
          </div>
          <div class="col-md-6"><label class="form-label fw-semibold small">Application deadline</label><input class="form-control" id="f-deadline" placeholder="e.g. 31 Dec 2026 or 'Open year-round'"></div>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="f-senior-only">
          <label class="form-check-label small" for="f-senior-only">Restricted to senior citizens (60+)</label>
        </div>
        <div class="mb-3"><label class="form-label fw-semibold small">Required documents (comma-separated)</label><input class="form-control" id="f-documents" placeholder="Aadhaar Card, Income Certificate, ..."></div>
        <div class="mb-3"><label class="form-label fw-semibold small">Official application link</label><input class="form-control" id="f-apply-link" placeholder="https://"></div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-wb-primary" id="save-scheme-btn">Add scheme</button>
          <button type="button" class="btn btn-wb-outline" onclick="switchAdminTab('schemes')">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="panel-stats" class="d-none">
    <div class="wb-card p-4">
      <div class="fw-bold mb-3" style="font-size:14px;">Schemes by category</div>
      <div id="category-bars"></div>
      <div class="wb-help-box mt-3">Figures are read live from the database via GET /api/admin/stats.</div>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/navbar.js"></script>
<script>
  const user = requireRole("ADMIN");
  let schemes = [];
  let editingId = null;

  if (user) {
    renderNavbar("admin");
    loadSchemes();
    loadStats();
    document.getElementById("scheme-form").addEventListener("submit", handleSubmit);
  }

  async function loadSchemes() {
    try {
      schemes = await Api.listSchemes();
      renderSchemesTable();
    } catch (err) {
      showToast(err.message);
    }
  }

  async function loadStats() {
    try {
      const stats = await Api.adminStats();
      renderStatCards(stats);
      renderCategoryBars(stats.byCategory);
    } catch (err) {
      // stats are non-critical
    }
  }

  function renderStatCards(stats) {
    document.getElementById("admin-stats").innerHTML = `
      <div class="col-6 col-md-3"><div class="wb-astat"><div class="n">${stats.totalSchemes}</div><div class="l">Active schemes</div></div></div>
      <div class="col-6 col-md-3"><div class="wb-astat"><div class="n">${stats.totalCitizens}</div><div class="l">Registered citizens</div></div></div>
      <div class="col-6 col-md-3"><div class="wb-astat"><div class="n">${stats.totalSaves}</div><div class="l">Schemes saved by users</div></div></div>
      <div class="col-6 col-md-3"><div class="wb-astat"><div class="n">${Object.keys(stats.byCategory).length}</div><div class="l">Categories in use</div></div></div>
    `;
  }

  function renderCategoryBars(byCategory) {
    const max = Math.max(1, ...Object.values(byCategory));
    document.getElementById("category-bars").innerHTML = Object.entries(byCategory).map(([cat, count]) => `
      <div class="d-flex align-items-center gap-2 mb-2">
        <div style="width:120px; font-size:13px; color:var(--gray-600); flex-shrink:0;">${escapeHtml(cat)}</div>
        <div style="flex:1; background:var(--gray-100); border-radius:6px; height:10px; overflow:hidden;">
          <div style="width:${(count / max) * 100}%; background:linear-gradient(90deg,var(--blue-600),var(--violet-600)); height:100%;"></div>
        </div>
        <div style="width:24px; text-align:right; font-size:13px; font-weight:600; color:var(--gray-900);">${count}</div>
      </div>
    `).join("");
  }

  function renderSchemesTable() {
    document.getElementById("schemes-table-body").innerHTML = schemes.map(s => `
      <tr>
        <td>
          <div style="font-weight:600; color:var(--gray-900);">${escapeHtml(s.name)}</div>
          <div style="color:var(--gray-400); font-size:12px;">${escapeHtml(s.department)}</div>
        </td>
        <td><span class="wb-tag-cat">${escapeHtml(s.category)}</span></td>
        <td>${escapeHtml(s.state)}</td>
        <td>${s.maxIncome ? '₹' + s.maxIncome.toLocaleString('en-IN') : '—'}</td>
        <td>${escapeHtml(s.deadline || '')}</td>
        <td>
          <div class="d-flex gap-1">
            <button class="wb-icon-btn" title="Edit" onclick="startEdit(${s.id})">✎</button>
            <button class="wb-icon-btn" title="Remove" onclick="deleteScheme(${s.id})">🗑</button>
          </div>
        </td>
      </tr>
    `).join("");
  }

  function switchAdminTab(tab) {
    document.getElementById("tab-schemes").classList.toggle("active", tab === "schemes");
    document.getElementById("tab-add").classList.toggle("active", tab === "add");
    document.getElementById("tab-stats").classList.toggle("active", tab === "stats");
    document.getElementById("panel-schemes").classList.toggle("d-none", tab !== "schemes");
    document.getElementById("panel-add").classList.toggle("d-none", tab !== "add");
    document.getElementById("panel-stats").classList.toggle("d-none", tab !== "stats");
  }

  function startAdd() {
    editingId = null;
    document.getElementById("form-heading").textContent = "Add a new scheme";
    document.getElementById("save-scheme-btn").textContent = "Add scheme";
    document.getElementById("tab-add").textContent = "Add scheme";
    clearForm();
    switchAdminTab("add");
  }

  function startEdit(id) {
    const s = schemes.find(x => x.id === id);
    if (!s) return;
    editingId = id;
    document.getElementById("form-heading").textContent = "Edit scheme";
    document.getElementById("save-scheme-btn").textContent = "Save changes";
    document.getElementById("tab-add").textContent = "Edit scheme";

    document.getElementById("f-name").value = s.name || "";
    document.getElementById("f-department").value = s.department || "";
    document.getElementById("f-category").value = s.category || "Education";
    document.getElementById("f-state").value = s.state || "All India";
    document.getElementById("f-benefit").value = s.benefit || "";
    document.getElementById("f-description").value = s.description || "";
    document.getElementById("f-min-age").value = s.minAge ?? "";
    document.getElementById("f-max-age").value = s.maxAge ?? "";
    document.getElementById("f-max-income").value = s.maxIncome ?? "";
    document.getElementById("f-occupation").value = s.occupation || "any";
    document.getElementById("f-gender").value = s.gender || "any";
    document.getElementById("f-senior-only").checked = !!s.seniorOnly;
    document.getElementById("f-documents").value = (s.documents || []).join(", ");
    document.getElementById("f-deadline").value = s.deadline || "";
    document.getElementById("f-apply-link").value = s.applyLink || "";

    switchAdminTab("add");
  }

  function clearForm() {
    document.getElementById("scheme-form").reset();
    document.getElementById("f-category").value = "Education";
    document.getElementById("f-state").value = "All India";
    document.getElementById("f-occupation").value = "any";
    document.getElementById("f-gender").value = "any";
  }

  async function handleSubmit(e) {
    e.preventDefault();

    const name = document.getElementById("f-name").value.trim();
    const department = document.getElementById("f-department").value.trim();
    const benefit = document.getElementById("f-benefit").value.trim();

    if (!name || !department || !benefit) {
      showToast("Please fill in at least the name, department, and benefit.");
      return;
    }

    const payload = {
      name, department, benefit,
      category: document.getElementById("f-category").value,
      description: document.getElementById("f-description").value.trim(),
      minAge: document.getElementById("f-min-age").value === "" ? null : parseInt(document.getElementById("f-min-age").value, 10),
      maxAge: document.getElementById("f-max-age").value === "" ? null : parseInt(document.getElementById("f-max-age").value, 10),
      maxIncome: document.getElementById("f-max-income").value === "" ? null : parseInt(document.getElementById("f-max-income").value, 10),
      state: document.getElementById("f-state").value,
      occupation: document.getElementById("f-occupation").value,
      gender: document.getElementById("f-gender").value,
      seniorOnly: document.getElementById("f-senior-only").checked,
      documents: document.getElementById("f-documents").value.split(",").map(d => d.trim()).filter(Boolean),
      deadline: document.getElementById("f-deadline").value.trim() || "Open year-round",
      applyLink: document.getElementById("f-apply-link").value.trim() || "#",
    };

    try {
      if (editingId != null) {
        await Api.adminUpdateScheme(editingId, payload);
        showToast("Scheme updated.");
      } else {
        await Api.adminCreateScheme(payload);
        showToast("Scheme added to the catalogue.");
      }
      switchAdminTab("schemes");
      await loadSchemes();
      await loadStats();
    } catch (err) {
      showToast(err.message);
    }
  }

  async function deleteScheme(id) {
    try {
      await Api.adminDeleteScheme(id);
      showToast("Scheme removed from the catalogue.");
      await loadSchemes();
      await loadStats();
    } catch (err) {
      showToast(err.message);
    }
  }
</script>
</body>
</html>
