<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — WelfareBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="wb-navbar"></div>

<main>
  <div class="d-flex justify-content-center py-5 px-3">
    <div class="wb-card p-4" style="width:100%; max-width:420px;">
      <div class="text-center mb-4">
        <span class="wb-brand-mark mx-auto mb-3" style="display:flex;">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none">
            <path d="M10 2L17 5.5V10c0 4.5-3 7.5-7 8-4-.5-7-3.5-7-8V5.5L10 2z" fill="white" fill-opacity=".95"/>
            <path d="M7 10l2 2 4-4" stroke="#3b6ef6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div style="font-size:19px; font-weight:800; color:var(--gray-900);">Welcome to WelfareBridge</div>
        <div id="auth-subtitle" style="font-size:13px; color:var(--gray-500); margin-top:4px;">Log in to continue</div>
      </div>

      <div class="wb-auth-tabs">
        <button class="wb-auth-tab active" id="tab-login" onclick="switchTab('login')">Log in</button>
        <button class="wb-auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <div id="auth-error" class="wb-error-box d-none"></div>

      <div class="mb-3">
        <label class="form-label fw-semibold small">I am signing in as</label>
        <div class="d-flex gap-2">
          <div class="wb-role-opt active" id="role-user" onclick="setRole('USER')">Citizen</div>
          <div class="wb-role-opt" id="role-admin" onclick="setRole('ADMIN')">Administrator</div>
        </div>
      </div>

      <div id="name-field" class="mb-3 d-none">
        <label class="form-label fw-semibold small">Full name</label>
        <input type="text" class="form-control" id="input-name" placeholder="e.g. Aditi Sharma">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold small">Email address</label>
        <input type="email" class="form-control" id="input-email" placeholder="you@example.com">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold small">Password</label>
        <input type="password" class="form-control" id="input-password" placeholder="••••••••">
      </div>

      <button class="btn btn-wb-primary w-100" id="submit-btn" onclick="submitAuth()">Log in</button>

      <div class="wb-help-box" id="help-box">
        Demo platform: register a new citizen account, or use the demo administrator account below.
      </div>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/navbar.js"></script>
<script>
  renderNavbar("auth");

  let currentTab = "login";
  let currentRole = "USER";

  // Support links like auth.html?role=ADMIN or auth.html?tab=register
  const params = new URLSearchParams(window.location.search);
  if (params.get("role") === "ADMIN") setRole("ADMIN");
  if (params.get("tab") === "register") switchTab("register");

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById("tab-login").classList.toggle("active", tab === "login");
    document.getElementById("tab-register").classList.toggle("active", tab === "register");
    document.getElementById("name-field").classList.toggle("d-none", tab !== "register");
    document.getElementById("submit-btn").textContent = tab === "login" ? "Log in" : "Create account";
    document.getElementById("auth-subtitle").textContent = tab === "login" ? "Log in to continue" : "Create your account to get started";
    hideError();
  }

  function setRole(role) {
    currentRole = role;
    document.getElementById("role-user").classList.toggle("active", role === "USER");
    document.getElementById("role-admin").classList.toggle("active", role === "ADMIN");

    const helpBox = document.getElementById("help-box");
    if (role === "ADMIN") {
      helpBox.textContent = "Demo administrator account — email: admin@welfarebridge.gov.in, password: admin123.";
      if (currentTab === "login") {
        document.getElementById("input-email").value = "admin@welfarebridge.gov.in";
        document.getElementById("input-password").value = "admin123";
      }
    } else {
      helpBox.textContent = "Demo platform: register a new citizen account, or use the demo administrator account below.";
    }
  }

  function showError(msg) {
    const el = document.getElementById("auth-error");
    el.textContent = msg;
    el.classList.remove("d-none");
  }
  function hideError() {
    document.getElementById("auth-error").classList.add("d-none");
  }

  async function submitAuth() {
    hideError();
    const email = document.getElementById("input-email").value.trim();
    const password = document.getElementById("input-password").value;

    if (!email || !password) { showError("Please fill in all fields."); return; }

    try {
      let res;
      if (currentTab === "login") {
        res = await Api.login({ email, password });
        if (res.role !== currentRole) {
          showError(`This account is registered as ${res.role === "ADMIN" ? "an administrator" : "a citizen"}. Select the matching option above.`);
          return;
        }
      } else {
        const name = document.getElementById("input-name").value.trim();
        if (!name) { showError("Please enter your full name."); return; }
        if (password.length < 6) { showError("Password must be at least 6 characters."); return; }
        res = await Api.register({ name, email, password, role: currentRole });
      }

      Auth.setSession(res);
      window.location.href = res.role === "ADMIN" ? "admin.html" : "dashboard.html";
    } catch (err) {
      showError(err.message);
    }
  }
</script>
</body>
</html>
